# nginx snippet: serve the Told by Mouth server under /tbm/ on an existing
# HTTPS server block (for example the certbot-managed one on this box).
# Paste inside that `server { listen 443 ssl; ... }` block, then:
#   sudo nginx -t && sudo systemctl reload nginx
# The phones then call https://<your-domain>/tbm/v1/...

location /tbm/ {
    proxy_pass http://127.0.0.1:8787/;   # trailing slash strips the /tbm prefix
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 64k;            # requests are tiny
    proxy_read_timeout 15s;
}
