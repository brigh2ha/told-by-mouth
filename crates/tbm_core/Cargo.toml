[package]
name = "tbm_core"
version = "0.1.0"
description = "Told by Mouth shared core: every rule for reviews, signatures, lists, meetings and trades. Pure Rust, no I/O."
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
p256 = { version = "0.13", features = ["ecdsa"] }
sha2 = "0.10"
rand_core = { version = "0.6", features = ["getrandom"] }
thiserror = "2"

[features]
# Test helpers (fake server, people, visits) for simulations and other crates' tests.
testkit = []

[dev-dependencies]
tbm_core = { path = ".", features = ["testkit"] }
