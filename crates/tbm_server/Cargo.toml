[package]
name = "tbm_server"
version = "0.1.0"
description = "Told by Mouth server: real-name certificates, visit stamps and the revocation list. Stores no reviews."
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
tbm_core = { workspace = true }
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
base64 = "0.22"
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tbm_core = { workspace = true, features = ["testkit"] }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
tempfile = "3"
